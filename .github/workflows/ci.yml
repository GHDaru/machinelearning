name: CI

# Os hard gates da Definition of Done (Princípio IX). O que é mecânico é
# verificado aqui; o que exige julgamento está no pull_request_template.md.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Forcing function: toda PR registra o que mudou para o leitor.
  # Bypass para mudanças internas: label `skip-changelog`.
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir entrada no CHANGELOG.md
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md atualizado ✓"
          else
            echo "::error::Toda PR adiciona uma entrada em [Unreleased] no CHANGELOG.md (ou aplica o label 'skip-changelog')."
            exit 1
          fi

  livro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: publicar

      # Gate do banco: exercício sem gabarito, sem feedback, sem objetivo
      # válido ou com id duplicado derruba o build. Erro de autoria não é aviso.
      - name: Gate do banco de exercícios
        run: node exercicios.mjs --verificar
        working-directory: publicar

      # Gate de deriva: o banco versionado tem de bater com a fonte no livro.
      # Sem isto, o backend corrigiria por uma versão antiga do exercício.
      - name: Gate de deriva do banco
        run: |
          node exercicios.mjs
          if ! git diff --exit-code -- ../chat-companion/backend/banco.json; then
            echo "::error::banco.json está fora de sincronia com o livro. Rode 'node publicar/exercicios.mjs' e faça commit."
            exit 1
          fi
        working-directory: publicar

      # Gate do viés de comprimento (D17). BILATERAL: reprova tanto o banco em que
      # marcar a alternativa mais longa acerta demais quanto aquele em que RISCAR
      # a mais longa elimina de graça. Os dois já aconteceram neste repositório.
      - name: Gate de viés de comprimento nas múltiplas
        run: node gates/vies-de-comprimento.mjs
        working-directory: publicar

      # Gate do glossário ligado. O livro tinha ZERO ligações para
      # `livro/glossario.md` em 27 capítulos; a régua é a do Google Machine
      # Learning Crash Course, que liga cada termo no primeiro uso. A unidade
      # aqui é o CARTÃO, porque é um cartão por vez que o leitor vê. Os 26
      # capítulos ainda não ligados estão em LIGACAO_PENDENTE: medidos,
      # relatados em toda execução, e não reprovam.
      - name: Gate do glossário ligado
        run: node gates/glossario-ligado.mjs
        working-directory: publicar

      # Gate do pré-requisito antes do uso (ADR 0023). Nenhum cartão usa um
      # termo que a sequência ainda não apresentou. O `II.2` tinha seis
      # inversões medidas, e a pior delas era a AUC: usada em quatro lugares e
      # definida em nenhum, sem que portão nenhum tivesse como perceber. Os 26
      # capítulos ainda não anotados estão em PRE_REQUISITO_PENDENTE: medidos,
      # relatados em toda execução, e não reprovam.
      - name: Gate do pré-requisito antes do uso
        run: node gates/pre-requisito.mjs
        working-directory: publicar

      # Gate do vocabulário desenhado (D28). O que o navegador escreve depois da
      # carga não está no Markdown, e por isso não existia para portão nenhum: o
      # painel do laboratório do cartão 4 do `II.2` imprime "R²" e o gate de
      # pré-requisito declarava o termo apresentado no cartão 23. O corpus é
      # gerado por um passe de navegador e guarda a impressão digital de
      # `tema/laboratorios.js`; este passo confere só a impressão, que não precisa
      # de navegador. Defasou, quem mexeu no tema regenera na máquina:
      #   PLAYWRIGHT=… CHROMIUM=… node publicar/vocabulario-desenhado.mjs --gerar
      - name: Gate do vocabulário desenhado
        run: node vocabulario-desenhado.mjs
        working-directory: publicar

      # Gate da escada da prática (ADR 0023, decisão 2; régua da ADR 0014). O
      # trio de um objetivo sobe e termina no verbo declarado: E1 dois degraus
      # abaixo, E2 um degrau abaixo, E3 no verbo. Reprova teto não atingido, teto
      # ultrapassado, queda de mais de um degrau dentro do nível e platô acima de
      # quatro cartões. A dívida (22 abertas acima do verbo, 4 objetivos sem E3 e
      # o platô de cinco na abertura do `II.2`) é medida, relatada e não reprova.
      - name: Gate da escada da prática
        run: node gates/escada.mjs
        working-directory: publicar

      # Gate de links relativos: todo `[texto](alvo.md)` do livro resolve para
      # um arquivo que existe. Sem ele, o reescritor do build manda o alvo
      # desconhecido para o GitHub, e o erro de digitação vira um 404 bem-formado.
      - name: Gate de links relativos
        run: node gates/links-relativos.mjs
        working-directory: publicar

      # Gate de links internos quebrados.
      - name: Build do livro
        run: node build.mjs
        working-directory: publicar

      # Os 25 testes de publicar/testes/ rodam o laboratorios.js REAL e conferem
      # os números que o livro promete ao leitor. Rodavam à mão, no dia em que
      # cada um nasceu, e a CI nunca os chamou — teste que ninguém roda não
      # guarda nada. Agora chama.
      - name: Testes dos laboratórios e animações
        run: node testes/rodar.mjs
        working-directory: publicar

      # As figuras são GERADAS a partir dos dados, e ficam versionadas como SVG.
      # Sem este passo, o dado podia mudar e a figura seguir afirmando o número
      # velho, em silêncio, ao lado de um texto que já dizia outro. Cada gerador
      # também traz asserções próprias; aqui alguém as executa.
      - name: Gate de deriva das figuras
        run: node figuras/verificar.mjs
        working-directory: publicar

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar e testar o backend
        run: |
          pip install -q -r requirements.txt pytest
          python -m pytest tests/ -q
        working-directory: chat-companion/backend

  ml-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar a trilha prática
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q
        working-directory: ml-zero

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Princípio V: chave exposta é chave comprometida. Este gate é grosseiro
      # de propósito — pega o caso óbvio antes que ele chegue ao histórico.
      - name: Procurar segredos óbvios
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::Possível credencial no repositório. Revogue a chave ANTES de remover o commit."
            exit 1
          fi
          echo "Nenhum segredo óbvio ✓"
