name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "ml-zero/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes da trilha ml-zero (a construção não pode apodrecer)
        run: pip install -q -r requirements.txt && python -m pytest -q
        working-directory: ml-zero

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar

      - name: Gerar o site (banco de exercícios + Markdown -> docs/)
        run: npm run build
        working-directory: publicar

      # Requer que o Pages esteja habilitado uma vez no repositório
      # (Settings → Pages → Source: GitHub Actions). O token do Actions não
      # tem permissão para criar o site sozinho — é a única etapa manual.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
