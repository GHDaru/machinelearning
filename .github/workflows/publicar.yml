name: Publicar o livro

# O site é construído pelo motor próprio (publicar/) e publicado nos DOIS
# destinos durante a janela de migração (ADR 0006):
#
#   • GitHub Pages — o endereço atual, que continua servindo o livro até o
#     domínio novo estar de pé. Aposentado no passo 8 do DEPLOY.md, por um
#     workflow manual que o substitui por um stub de redirecionamento.
#   • Vercel — o destino, **só quando os segredos existirem**. Enquanto o autor
#     não criar o projeto, este passo é PULADO em vez de falhar: um deploy
#     vermelho não pode ser o preço de uma migração ainda em andamento.
#
# POR QUE A VERCEL NÃO PUBLICA SOZINHA: o vercel.json desliga o deploy
# automático do `main`. Se ela publicasse pela integração Git, o site iria ao ar
# mesmo com os testes vermelhos, e o gate do Princípio IX viraria enfeite. Aqui
# os portões correm ANTES. Previews de branch continuam automáticos na Vercel —
# é o motivo de termos migrado.

# POR QUE NÃO HÁ FILTRO DE CAMINHOS AQUI (2026-09-05)
#
# Havia, e ele listava `livro/`, `publicar/`, `ml-zero/`, a constituição e este
# arquivo. A economia era real e o custo apareceu de uma vez:
#
#   1. uma publicação reprovou na CI, por um teste do backend;
#   2. o conserto foi em `chat-companion/backend/`, que não estava na lista;
#   3. o push seguinte rodou a CI, passou, e **não disparou esta publicação**;
#   4. o site ficou com a versão antiga, e nada em lugar nenhum disse isso.
#
# A falha silenciosa é o ponto. Um deploy vermelho avisa; um deploy que não
# acontece não avisa nada, e quem olha o commit verde na `main` conclui que
# está no ar. Foi exatamente essa conclusão errada que se tirou aqui.
#
# O filtro economizava minutos de runner e pagava com correção. Este repositório
# recusa essa troca em todos os outros portões, e passa a recusá-la aqui: toda
# entrada na `main` publica, e quem decide se o conteúdo presta são os portões
# que já correm dentro deste workflow, antes do deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes da trilha ml-zero (a construção não pode apodrecer)
        run: pip install -q -r requirements.txt && python -m pytest -q
        working-directory: ml-zero

      # O README do ml-zero afirma que os notebooks são verificados. Afirmação
      # sem gate é promessa: este passo executa TODAS as células, a partir da
      # pasta da etapa, como o aluno faria. Notebook que não roda é pior que
      # notebook nenhum — ele quebra no meio da aula.
      - name: Os notebooks rodam? (todas as células)
        run: python tests/rodar_notebooks.py
        working-directory: ml-zero

      - name: Testes do backend (inclusive o CORS do ADR 0006)
        run: pip install -q -r requirements.txt && python -m pytest tests/ -q
        working-directory: chat-companion/backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar

      # O banco.json versionado é o que o backend serve ao leitor. Se ele
      # divergir do livro, o aluno abre um exercício que existe na página e
      # recebe "não encontrado" — ou é corrigido contra um gabarito antigo.
      - name: Gate do banco de exercícios (não pode ter derivado)
        run: node exercicios.mjs --verificar
        working-directory: publicar

      # O build carrega os gates do Princípio X: seção histórica obrigatória,
      # alfabeto de selos lido da constituição, e o nível visível na página.
      - name: Gerar o site
        run: npm run build
        working-directory: publicar

      # OS DOIS GATES QUE ABREM A PÁGINA NUM NAVEGADOR. Todos os outros leem
      # a fonte; estes leem o PRODUTO. Existiam e a CI nunca os chamava —
      # rodavam à mão no dia em que nasceram, e depois nunca mais. Gate que
      # ninguém roda não guarda nada.
      #
      # Custam um Chromium (~150 MB) no runner. O leitor não paga nada disso:
      # a trilha de custo zero é a do aluno, não a da nossa integração.
      - name: Instalar o Chromium para os gates de navegador
        run: npx --yes playwright@1 install --with-deps chromium
        working-directory: publicar

      # Rolagem lateral a 360px, exercícios do fonte chegando ao DOM,
      # laboratórios montando, companion carregando e console limpo.
      - name: Auditoria da jornada (81 páginas a 360px)
        run: node jornada.mjs
        working-directory: publicar
        env:
          PLAYWRIGHT: playwright

      # Um cartão tem de ser FECHÁVEL. Sem teto e sem piso, a barra de
      # progresso mente sobre o esforço que falta.
      - name: Gate do modo cartão (o cartão fecha?)
        run: node gates/cartoes-legiveis.mjs
        working-directory: publicar
        env:
          PLAYWRIGHT: playwright

      # O `:::aprofundar` promete que o texto fechado não entra na contagem de
      # palavras do cartão, e essa promessa é do NAVEGADOR: `innerText` depende
      # de layout, e nenhum DOM falso o modela. O teste roda no job `livro` sem
      # navegador e diz em voz alta que não mediu; aqui ele mede.
      - name: O texto fechado do `:::aprofundar` fica fora da conta do cartão
        run: node testes/aprofundar.mjs
        working-directory: publicar
        env:
          PLAYWRIGHT: playwright

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  vercel:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: docs

      # Enquanto o projeto na Vercel não existir, este job informa e sai verde.
      # A alternativa — falhar — deixaria o CI vermelho por uma etapa que
      # depende de uma ação humana ainda não feita, e CI vermelho crônico
      # ensina a equipe a ignorar CI vermelho.
      - name: Promover para a Vercel (produção)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "⏭  VERCEL_TOKEN ausente — migração ainda não concluída."
            echo "   O livro continua sendo servido pelo GitHub Pages."
            echo "   Passo a passo: chat-companion/DEPLOY.md"
            exit 0
          fi
          npx --yes vercel@latest deploy docs --prod --yes --archive=tgz --token="$VERCEL_TOKEN"

      # SMOKE TEST — o risco que o ADR 0006 mais teme é a degradação
      # SILENCIOSA: se o CORS da API não aceitar o domínio do site, o chat e a
      # correção morrem exibindo "não deu para corrigir agora", enquanto os
      # laboratórios seguem funcionando e mascaram a falha. Aqui isso vira
      # build vermelho em vez de reclamação de aluno.
      - name: Smoke test — a API aceita o domínio do livro?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "⏭  Migração em andamento — smoke test adiado."
            exit 0
          fi
          origem="https://machinelearning.ghdaru.com.br"
          api="https://api.machinelearning.ghdaru.com.br"

          echo "→ $api/health"
          curl -fsS --max-time 20 "$api/health" | tee /tmp/health.json
          grep -q '"ok": *true' /tmp/health.json || { echo "✗ /health não respondeu ok"; exit 1; }

          echo "→ CORS para $origem"
          curl -fsS --max-time 20 -X OPTIONS "$api/health" \
            -H "Origin: $origem" -H "Access-Control-Request-Method: GET" -D- -o /dev/null \
            | grep -i "access-control-allow-origin" \
            || { echo "✗ A API não devolveu access-control-allow-origin para $origem."; \
                 echo "  Confira ALLOWED_ORIGINS no Railway — o chat e a correção estão quebrados AGORA."; \
                 exit 1; }
          echo "✓ API no ar e aceitando o domínio do livro"
