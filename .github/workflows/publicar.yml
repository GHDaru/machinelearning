name: Publicar o livro (Vercel)

# O site é construído pelo motor próprio (publicar/) e promovido para a Vercel.
#
# POR QUE O DEPLOY PASSA POR AQUI, e não pela integração Git da Vercel:
# o vercel.json desliga o deploy automático do `main` (`deploymentEnabled`).
# Se a Vercel publicasse sozinha, o site iria ao ar mesmo com os testes
# vermelhos, e o gate do Princípio IX ("prove, não declare") viraria enfeite.
# Aqui os portões correm ANTES da promoção. Previews de branch continuam
# automáticos na Vercel — é o motivo de termos migrado (ADR 0006).

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "ml-zero/**"
      - ".specify/memory/constitution.md"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://machinelearning.ghdaru.com.br
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes da trilha ml-zero (a construção não pode apodrecer)
        run: pip install -q -r requirements.txt && python -m pytest -q
        working-directory: ml-zero

      - name: Testes do backend (inclusive o CORS do ADR 0006)
        run: pip install -q -r requirements.txt && python -m pytest tests/ -q
        working-directory: chat-companion/backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar

      # Gate do banco: o banco.json versionado é o que o backend serve. Se ele
      # divergir do Markdown, o leitor recebe correção de um exercício que não
      # é mais o que está na página.
      - name: Gate do banco de exercícios
        run: node exercicios.mjs --verificar
        working-directory: publicar

      # O build carrega os gates do Princípio X: seção histórica obrigatória,
      # alfabeto de selos lido da constituição, nível visível na página.
      - name: Gerar o site
        run: npm run build
        working-directory: publicar

      - name: Promover para a Vercel (produção)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy docs --prod --yes --archive=tgz --token="$VERCEL_TOKEN"

      # SMOKE TEST BLOQUEANTE — o risco que o ADR 0006 mais teme é a
      # degradação SILENCIOSA: se o CORS da API não aceitar o domínio do site,
      # o chat e a correção morrem exibindo "não deu para corrigir agora", e os
      # laboratórios continuam funcionando, mascarando a falha. Aqui isso vira
      # deploy vermelho em vez de reclamação de aluno.
      - name: Smoke test — a API aceita o domínio do livro?
        run: |
          set -euo pipefail
          origem="https://machinelearning.ghdaru.com.br"
          api="https://api.machinelearning.ghdaru.com.br"

          echo "→ /health"
          curl -fsS --max-time 20 "$api/health" | tee /tmp/health.json
          grep -q '"ok": *true' /tmp/health.json

          echo "→ CORS para $origem"
          cabecalhos=$(curl -fsS --max-time 20 -X OPTIONS "$api/health" \
            -H "Origin: $origem" -H "Access-Control-Request-Method: GET" -D- -o /dev/null)
          echo "$cabecalhos" | grep -i "access-control-allow-origin" \
            || { echo "✗ A API não devolveu access-control-allow-origin para $origem."; \
                 echo "  Confira ALLOWED_ORIGINS no Railway. O chat e a correção estão quebrados AGORA."; \
                 exit 1; }
          echo "✓ API no ar e aceitando o domínio do livro"
