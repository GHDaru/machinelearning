<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"
     aria-label="Diagrama do neurônio de McCulloch–Pitts: as entradas x1 e x2 são multiplicadas pelos pesos w1 e w2, somadas no corpo do neurônio, comparadas com o limiar teta, e a saída é 1 se a soma alcançar o limiar e 0 caso contrário.">
  <title>Neurônio de McCulloch–Pitts (1943)</title>
  <style>
    .rot   { font: 15px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6a6a6a; }
    .var   { font: italic 17px Georgia, serif; fill: #1c1c1c; }
    .peso  { font: italic 15px Georgia, serif; fill: #a15a00; }
    .mat   { font: italic 19px Georgia, serif; fill: #1c1c1c; }
    .nota  { font: 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8a8a86; }
    .fio   { stroke: #b9b9b4; stroke-width: 2; fill: none; }
    .chave { stroke: #1c1c1c; stroke-width: 1.6; fill: none; stroke-linecap: round; }
    .fio-f { stroke: #e0a24a; stroke-width: 2.5; fill: none; }
    .caixa { fill: #f7f7f5; stroke: #d8d8d4; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .rot { fill: #9a9a97; } .var { fill: #e6e6e4; } .mat { fill: #e6e6e4; }
      .nota { fill: #74777c; } .fio { stroke: #4a4d52; }
      .chave { stroke: #e6e6e4; }
      .caixa { fill: #1d1f22; stroke: #33363b; }
    }
  </style>

  <!-- entradas -->
  <circle cx="60" cy="95" r="24" class="caixa"/>
  <text x="60" y="102" text-anchor="middle" class="var">x₁</text>
  <circle cx="60" cy="215" r="24" class="caixa"/>
  <text x="60" y="222" text-anchor="middle" class="var">x₂</text>
  <text x="60" y="52" text-anchor="middle" class="rot">entradas</text>

  <!-- sinapses -->
  <path class="fio" d="M84 95 L 236 140"/>
  <path class="fio" d="M84 215 L 236 170"/>
  <text x="150" y="103" text-anchor="middle" class="peso">w₁</text>
  <text x="150" y="222" text-anchor="middle" class="peso">w₂</text>
  <text x="152" y="63" text-anchor="middle" class="rot">pesos</text>

  <!-- corpo: soma -->
  <circle cx="288" cy="155" r="52" class="caixa"/>
  <text x="288" y="166" text-anchor="middle" class="mat">Σ</text>
  <text x="288" y="235" text-anchor="middle" class="rot">soma ponderada</text>
  <text x="288" y="253" text-anchor="middle" class="nota">w₁x₁ + w₂x₂</text>

  <!-- fio para o limiar -->
  <path class="fio" d="M340 155 L 408 155"/>

  <!-- limiar -->
  <rect x="408" y="105" width="118" height="100" rx="10" class="caixa"/>
  <text x="467" y="150" text-anchor="middle" class="mat">≥ θ ?</text>
  <!-- mini degrau -->
  <path d="M425 185 L 462 185 L 462 165 L 509 165" stroke="#e0a24a" stroke-width="2.5" fill="none"/>
  <text x="467" y="235" text-anchor="middle" class="rot">compara com o limiar</text>
  <text x="467" y="253" text-anchor="middle" class="nota">função degrau</text>

  <!-- saída -->
  <path class="fio-f" d="M526 155 L 606 155"/>
  <polygon points="606,149 622,155 606,161" fill="#e0a24a"/>
  <circle cx="660" cy="155" r="28" class="caixa"/>
  <text x="660" y="162" text-anchor="middle" class="var">y</text>
  <text x="660" y="52" text-anchor="middle" class="rot">saída</text>
  <text x="660" y="205" text-anchor="middle" class="nota">1 ou 0</text>

  <!-- fórmula, escrita como a condicional que ela é: duas linhas e uma chave.
       Numa linha só, ligadas por um ponto, os dois ramos pareciam uma
       multiplicação — que é justamente o que a figura NÃO quer dizer. -->
  <text x="268" y="317" text-anchor="end" class="mat">y =</text>
  <path d="M 286 292 q -7 0 -7 8 v 9 q 0 8 -7 8 q 7 0 7 8 v 9 q 0 8 7 8"
        class="chave"/>
  <text x="302" y="311" class="mat">1</text>
  <text x="330" y="311" class="mat">se w₁x₁ + w₂x₂ ≥ θ</text>
  <text x="302" y="339" class="mat">0</text>
  <text x="330" y="339" class="mat">se w₁x₁ + w₂x₂ &lt; θ</text>
  <text x="360" y="367" text-anchor="middle" class="nota">McCulloch &amp; Pitts, 1943 — sem aprendizado: os pesos são postos à mão</text>
</svg>
