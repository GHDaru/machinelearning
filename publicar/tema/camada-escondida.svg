<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 684" role="img"
     aria-label="Duas vistas do mesmo problema XOR, uma acima da outra. Em cima, o espaço das entradas x1 e x2: os quatro casos ocupam os cantos de um quadrado, e os dois que devem disparar estão em cantos opostos, de modo que nenhuma reta os separa dos outros dois. Embaixo, o espaço da camada escondida h1 e h2, com cada ponto rotulado pela entrada de onde veio: as entradas (0,1) e (1,0) chegam ambas à mesma posição, de modo que quatro casos ocupam apenas três lugares. Nesse espaço uma única reta separa o que dispara do que não dispara.">
  <title>A camada escondida reescreve as coordenadas</title>
  <style>
    .tit  { font: 600 15px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1c1c; }
    .leg  { font: 13.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a4a4a; }
    .rot  { font: 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a4a4a; }
    .tick { font: 11.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6a6a6a; }
    .eixo-rot { font: italic 14px Georgia, serif; fill: #1c1c1c; }
    .seta { font: 600 13.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8a4d00; }
    .eixo { stroke: #8a8a86; stroke-width: 1.5; }
    .liga    { fill: #2a7a3f; stroke: #14532a; stroke-width: 1.5; }
    .desliga { fill: #fbfbfa; stroke: #4a4a4a; stroke-width: 2; }
    .fantasma { opacity: .5; }
    .corte   { stroke: #8a4d00; stroke-width: 3; stroke-linecap: round; }
    .fio     { stroke: #8a8a86; stroke-width: 2; fill: none; }
    .fundo   { fill: #fbfbfa; }
    @media (prefers-color-scheme: dark) {
      .fundo { fill: #17181a; }
      .tit, .eixo-rot { fill: #e6e6e4; } .leg, .rot { fill: #c8c8c5; } .tick { fill: #9a9a97; }
      .eixo, .fio { stroke: #6f7176; }
      .liga { fill: #6fd08a; stroke: #2a7a3f; }
      .desliga { fill: #17181a; stroke: #c8c8c5; }
      .corte, .seta { stroke: #e0a24a; fill: #e0a24a; }
    }
  </style>
  <rect width="100%" height="100%" class="fundo"/>
  <text x="191" y="52" text-anchor="middle" class="tit">Antes: o que a rede recebe</text>
  <line x1="62" y1="280" x2="326" y2="280" class="eixo"/>
  <line x1="86" y1="304" x2="86" y2="40" class="eixo"/>
  <text x="336" y="285" class="eixo-rot">x₁</text>
  <text x="86" y="32" text-anchor="middle" class="eixo-rot">x₂</text>
  <text x="86" y="302" text-anchor="middle" class="tick">0</text>
  <text x="72" y="285" text-anchor="end" class="tick">0</text>
  <text x="296" y="302" text-anchor="middle" class="tick">1</text>
  <text x="72" y="75" text-anchor="end" class="tick">1</text>
  <circle cx="86" cy="280" r="12" class="desliga"/>
  <text x="62" y="285" text-anchor="end" class="rot">(0,0)</text>
  <circle cx="86" cy="70" r="12" class="liga"/>
  <text x="62" y="75" text-anchor="end" class="rot">(0,1)</text>
  <circle cx="296" cy="280" r="12" class="liga"/>
  <text x="320" y="285" text-anchor="start" class="rot">(1,0)</text>
  <circle cx="296" cy="70" r="12" class="desliga"/>
  <text x="320" y="75" text-anchor="start" class="rot">(1,1)</text>
  <text x="191" y="326" text-anchor="middle" class="leg">Verde dispara, branco não. Nenhuma reta separa os dois grupos.</text>

  <line x1="191" y1="340" x2="191" y2="340" class="fio"/>
  <polygon points="185,340 191,356 197,340" class="corte" stroke="none"/>
  <text x="207" y="362" class="seta">a camada escondida</text>
  <text x="207" y="380" class="leg">h₁ = OU · h₂ = NÃO-E</text>
  <text x="191" y="380" text-anchor="middle" class="tit">Depois: o que a camada de saída vê</text>
  <line x1="62" y1="608" x2="326" y2="608" class="eixo"/>
  <line x1="86" y1="632" x2="86" y2="368" class="eixo"/>
  <text x="336" y="613" class="eixo-rot">h₁</text>
  <text x="86" y="360" text-anchor="middle" class="eixo-rot">h₂</text>
  <text x="86" y="630" text-anchor="middle" class="tick">0</text>
  <text x="72" y="613" text-anchor="end" class="tick">0</text>
  <text x="296" y="630" text-anchor="middle" class="tick">1</text>
  <text x="72" y="403" text-anchor="end" class="tick">1</text>
  <line x1="165.79999999999998" y1="372.79999999999995" x2="321.20000000000005" y2="528.2" class="corte"/>
  <circle cx="86" cy="398" r="12" class="desliga"/>
  <text x="62" y="403" text-anchor="end" class="rot">de (0,0)</text>
  <circle cx="303" cy="391" r="12" class="liga fantasma"/>
  <circle cx="296" cy="398" r="12" class="liga"/>
  <text x="320" y="403" text-anchor="start" class="rot">de (0,1) e (1,0)</text>
  <circle cx="296" cy="608" r="12" class="desliga"/>
  <text x="320" y="613" text-anchor="start" class="rot">de (1,1)</text>
  <text x="191" y="654" text-anchor="middle" class="leg">Uma reta basta — e duas entradas viraram um ponto só.</text>

</svg>
