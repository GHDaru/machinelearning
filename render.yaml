# Blueprint do backend do livro vivo — deploy de um clique no Render.
#
#   https://dashboard.render.com/select-repo?type=blueprint
#   → escolher GHDaru/machinelearning → Apply
#
# Sobe SEM nenhuma variável configurada: o adapter do modelo cai em `echo` e o
# store fica em memória. Isso já destrava a correção dos exercícios, que é
# determinística e não precisa de modelo nem de banco. Chave e Postgres entram
# depois, quando o tutor e a persistência forem desejados.
#
# Instruções completas: chat-companion/DEPLOY.md

services:
  - type: web
    name: livro-ml-backend
    runtime: python
    plan: free
    rootDir: chat-companion/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # De onde o site pode chamar o backend. Sem isto, o navegador bloqueia
      # por CORS e o erro aparece como "não deu para corrigir agora".
      - key: ALLOWED_ORIGINS
        value: https://ghdaru.github.io,http://localhost:8080,http://127.0.0.1:8080
      # echo = sem rede, sem custo. Trocar para `openai` quando houver chave.
      - key: LLM_ADAPTER
        value: echo
      # Chave do modelo: NUNCA no repositório (Princípio V). Marcada como
      # `sync: false` para o Render pedir o valor no painel, sem versioná-lo.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # Postgres: vazio = memória. Cole a URL aqui quando houver banco.
      - key: DATABASE_URL
        sync: false
      # Token das rotas de admin (/telemetry, /suggestions). Vazio = desabilitadas.
      - key: ADMIN_TOKEN
        sync: false
      - key: RATE_LIMIT_MSGS
        value: "20"
      - key: RATE_LIMIT_TENTATIVAS
        value: "60"
